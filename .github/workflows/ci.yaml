name: CI

on:
  pull_request:
    branches: [develop, main, 'release/**']
  push:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & test
        run: mvn -B -ntp verify
        env:
          SPRING_PROFILES_ACTIVE: test